<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yönlendirici</title>
<style>
:root { --bg: #f3f4f6; --card: #fff; --text: #111827; --muted: #6b7280; --primary: #2563eb; --success: #10b981; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --primary: #3b82f6; } }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
.container { width: 100%; max-width: 500px; }
.card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 16px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
.logo { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 11px; text-align: center; }
.info { flex: 1; margin-left: 15px; }
.bank { font-weight: 700; font-size: 16px; }
.acc { font-size: 12px; color: var(--muted); }
.iban { font-family: monospace; font-size: 14px; margin-top: 4px; }
.btn { background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
.btn.ok { background: var(--success); }
.msg { text-align: center; padding: 40px; color: var(--muted); }
.err { color: #ef4444; }
</style>
</head>
<body>
<div id="app" class="container"><div class="msg">Yükleniyor...</div></div>
<script>
(function(){
  var app = document.getElementById('app');
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  if(!id){ app.innerHTML = '<div class="msg err">Kart ID bulunamadı (?id=...)</div>'; return; }
  
  var base = window.location.pathname.replace(/\/g\/.*$/, '');
  fetch(base + '/routes.json?v=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('routes.json yüklenemedi'); return r.json(); })
    .then(function(data){
      var card = data[id];
      if(!card){ app.innerHTML = '<div class="msg err">Bu kart sistemde kayıtlı değil. ID: ' + id + '</div>'; return; }
      var d = card.data || {};
      if(card.card_type === 'Çoklu IBAN Kartı'){ showIbans(d); return; }
      var url = d.url || (d.username ? 'https://instagram.com/'+d.username : (d.phone ? 'https://wa.me/'+d.phone : null));
      if(url){ window.location.replace(url); } else { app.innerHTML = '<div class="msg err">Geçersiz link.</div>'; }
    }).catch(function(e){ app.innerHTML = '<div class="msg err">Hata: ' + e.message + '</div>'; });

  function showIbans(d){
    var html = '<div class="card"><h2 style="text-align:center;">' + esc(d.title || 'Banka Hesaplarım') + '</h2>';
    if(d.owner) html += '<div style="text-align:center; font-weight:bold; color:var(--primary); margin-bottom:15px;">Sahibi: ' + esc(d.owner) + '</div>';
    
    (d.accounts || []).forEach(function(a){
      html += '<div class="row">' +
        '<div class="logo" style="background:' + esc(a.bank_color || '#666') + '">' + esc(a.bank_name) + '</div>' +
        '<div class="info">' +
          '<div class="bank">' + esc(a.bank_name) + '</div>' +
          (a.account_title ? '<div class="acc">' + esc(a.account_title) + '</div>' : '') +
          (a.recipient ? '<div class="acc">Alıcı: ' + esc(a.recipient) + '</div>' : '') +
          '<div class="iban">' + esc(a.iban) + '</div>' +
        '</div>' +
        '<button class="btn" onclick="copyText(\'' + escAttr(a.iban) + '\', this)">Kopyala</button>' +
      '</div>';
    });
    html += '</div>';
    app.innerHTML = html;
  }
  
  window.copyText = function(t, btn) {
    var old = btn.innerHTML;
    navigator.clipboard.writeText(t).then(function(){ 
      btn.innerHTML = 'Kopyalandı ✓'; btn.classList.add('ok');
      setTimeout(function(){ btn.innerHTML = old; btn.classList.remove('ok'); }, 1500);
    });
  };
  function esc(s){ return String(s||'').replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function escAttr(s){ return String(s||'').replace(/'/g, "\\'"); }
})();
</script>
</body>
</html>
