<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Müşteri Paneli</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
.container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.form-group { margin-bottom: 15px; } label { font-weight: bold; display: block; margin-bottom: 5px; }
input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
button { padding: 10px 15px; background: #007bff; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
.btn-danger { background: #dc3545; } .btn-success { background: #28a745; }
.iban-row { display: flex; gap: 10px; margin-bottom: 10px; background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px solid #eee; }
.iban-row > div { flex: 1; } .preview { background: #eee; padding: 15px; border-radius: 5px; font-family: monospace; margin-top: 20px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="container">
  <h2>Müşteri Kartı Düzenle</h2>
  <p id="status" style="color: blue;">Yükleniyor...</p>
  <div id="formArea" style="display:none;">
    <div class="form-group"><label>Kart Başlığı</label><input id="cardTitle"></div>
    <div class="form-group"><label>Kart Sahibi</label><input id="cardOwner"></div>
    <div id="linkArea" style="display:none;"><div class="form-group"><label>Hedef Link</label><input id="targetUrl"></div></div>
    <div id="ibanArea" style="display:none;">
      <label>Banka Hesapları</label>
      <div id="ibanList"></div>
      <button type="button" onclick="addIbanRow()" style="background:#17a2b8; margin-bottom:15px;">+ IBAN Ekle</button>
    </div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn-success" onclick="saveJson()">JSON İndir</button>
    </div>
    <div class="preview" id="previewBox"></div>
  </div>
</div>
<script>
var BANKS = ['Akbank','Garanti BBVA','Ziraat Bankası','İş Bankası','Yapı Kredi','QNB','VakıfBank','Halkbank','Enpara','Kuveyt Türk','Diğer'];
var BCOLORS = {'Akbank':'#E30613','Garanti BBVA':'#009B4E','Ziraat Bankası':'#E30613','İş Bankası':'#004B93','Yapı Kredi':'#002B5C','QNB':'#5D2E8C','VakıfBank':'#FEC50C','Halkbank':'#004A99','Enpara':'#00A0E3','Kuveyt Türk':'#00A651','Diğer':'#666'};
var isIban = false, cId = '', oldData = null;

window.onload = function(){
  var params = new URLSearchParams(window.location.search);
  cId = params.get('id');
  if(!cId){ document.getElementById('status').innerText = 'Hata: ID yok.'; return; }
  fetch('routes.json?v='+Date.now()).then(r=>r.json()).then(data=>{
    if(!data[cId]) { document.getElementById('status').innerText = 'Hata: Kart bulunamadı.'; return; }
    oldData = data[cId].data;
    isIban = (data[cId].card_type === 'Çoklu IBAN Kartı');
    document.getElementById('status').style.display = 'none';
    document.getElementById('formArea').style.display = 'block';
    document.getElementById('cardTitle').value = oldData.title || '';
    document.getElementById('cardOwner').value = oldData.owner || '';
    if(isIban){
      document.getElementById('ibanArea').style.display = 'block';
      (oldData.accounts||[]).forEach(addIbanRow);
      if(!oldData.accounts || oldData.accounts.length === 0) addIbanRow();
    } else {
      document.getElementById('linkArea').style.display = 'block';
      document.getElementById('targetUrl').value = oldData.url || oldData.username || oldData.phone || '';
    }
    updatePreview();
  });
};

function addIbanRow(data) {
  data = data || {};
  var div = document.createElement('div');
  div.className = 'iban-row';
  var opts = BANKS.map(b=>`<option value="${b}" ${data.bank_name===b?'selected':''}>${b}</option>`).join('');
  div.innerHTML = `
    <div><label>Banka</label><select class="b-name">${opts}</select></div>
    <div><label>Etiket</label><input class="b-title" value="${data.account_title||''}"></div>
    <div><label>Alıcı</label><input class="b-recipient" value="${data.recipient||''}"></div>
    <div><label>IBAN</label><input class="b-iban" value="${data.iban||''}"></div>
    <button class="btn-danger" onclick="this.parentElement.remove();updatePreview()">X</button>
  `;
  div.querySelectorAll('input, select').forEach(el=>el.addEventListener('input', updatePreview));
  document.getElementById('ibanList').appendChild(div);
}

function buildJson(){
  var res = { title: document.getElementById('cardTitle').value, owner: document.getElementById('cardOwner').value };
  if(isIban){
    res.accounts = [];
    document.querySelectorAll('.iban-row').forEach(r=>{
      var iban = r.querySelector('.b-iban').value.trim();
      if(iban) {
        var bank = r.querySelector('.b-name').value;
        res.accounts.push({ bank_name: bank, bank_color: BCOLORS[bank]||'#666', account_title: r.querySelector('.b-title').value, recipient: r.querySelector('.b-recipient').value, iban: iban });
      }
    });
  } else {
    var v = document.getElementById('targetUrl').value;
    if(oldData.url !== undefined) res.url = v;
    else if(oldData.username !== undefined) res.username = v;
    else if(oldData.phone !== undefined) res.phone = v;
  }
  return res;
}

function updatePreview(){
  document.getElementById('previewBox').innerText = JSON.stringify(buildJson(), null, 2);
}

function saveJson(){
  var out = {}; out[cId] = { data: buildJson() };
  var blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'guncelleme_'+cId+'.json'; a.click();
}
</script>
</body>
</html>
